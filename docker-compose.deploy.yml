services:
  msvc-config:
    image: anonimato0/microservice-config:v1
    ports:
      - "8888:8888"
    restart: always
    networks:
      - agrocontrol-network

  msvc-eureka:
    image: anonimato0/microservice-eureka:v1
    ports:
      - "8761:8761"
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://msvc-config:8888
      EUREKA_SERVER: http://msvc-eureka:8761/eureka
    restart: always
    networks:
      - agrocontrol-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      - msvc-config

  mysql-agrocontrol:
    container_name: mysql-agrocontrol
    image: mysql:latest
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: iam-db
      MYSQL_ROOT_PASSWORD: root
    restart: always
    networks:
      - agrocontrol-network

  msvc-logs-and-traceability:
    container_name: msvc-logs-and-traceability
    image: openzipkin/zipkin-slim:latest
    ports:
      - "9411:9411"
    env_file:
      - .env.dev
    restart: always
    networks:
      - agrocontrol-network

  msvc-profile:
    image: anonimato0/microservice-profile:v1
    env_file:
      - .env.dev
    restart: always
    networks:
      - agrocontrol-network
    depends_on:
      - msvc-config
      - msvc-logs-and-traceability
      - msvc-eureka
      - mysql-agrocontrol

  msvc-iam:
    image: anonimato0/microservice-iam:v1
    ports:
      - "8091:8091"
    env_file:
      - .env.dev
    restart: always
    networks:
      - agrocontrol-network
    depends_on:
      - msvc-config
      - msvc-logs-and-traceability
      - msvc-eureka
      - mysql-agrocontrol
      - msvc-profile

  msvc-field:
    image: anonimato0/microservice-field:v1
    ports:
      - "8093:8093"
    env_file:
      - .env.dev
    restart: always
    networks:
      - agrocontrol-network
    depends_on:
      - msvc-config
      - msvc-logs-and-traceability
      - msvc-eureka
      - mysql-agrocontrol
      - msvc-profile

  msvc-finance:
    image: anonimato0/microservice-finance:v1
    ports:
      - "8094:8094"
    env_file:
      - .env.dev
    restart: always
    networks:
      - agrocontrol-network
    depends_on:
      - msvc-config
      - msvc-logs-and-traceability
      - msvc-eureka
      - mysql-agrocontrol

  msvc-payment:
    image: anonimato0/microservice-payment:v1
    ports:
      - "8095:8095"
    env_file:
      - .env.dev
    restart: always
    networks:
      - agrocontrol-network
    depends_on:
      - msvc-config
      - msvc-logs-and-traceability
      - msvc-eureka
      - mysql-agrocontrol
      - msvc-profile

  msvc-store:
    image: anonimato0/microservice-store:v1
    ports:
      - "8096:8096"
    env_file:
      - .env.dev
    restart: always
    networks:
      - agrocontrol-network
    depends_on:
      - msvc-config
      - msvc-logs-and-traceability
      - msvc-eureka
      - mysql-agrocontrol
      - msvc-profile

  msvc-subscription:
    image: anonimato0/microservice-subscription:v1
    ports:
      - "8097:8097"
    env_file:
      - .env.dev
    restart: always
    networks:
      - agrocontrol-network
    depends_on:
      - msvc-config
      - msvc-logs-and-traceability
      - msvc-eureka
      - mysql-agrocontrol

  msvc-agriculturalprocess:
    image: anonimato0/microservice-agriculturalprocess:v1
    ports:
      - "8098:8098"
    env_file:
      - .env.dev
    restart: always
    networks:
      - agrocontrol-network
    depends_on:
      - msvc-config
      - msvc-logs-and-traceability
      - msvc-eureka
      - mysql-agrocontrol
      - msvc-payment
      - msvc-store
      - msvc-field

  msvc-gateway:
    image: anonimato0/microservice-gateway:v1
    ports:
      - "8080:8080"
    env_file:
      - .env.dev
    restart: always
    networks:
      - agrocontrol-network
    depends_on:
      - msvc-config
      - msvc-logs-and-traceability
      - msvc-eureka
      - mysql-agrocontrol
      - msvc-profile
      - msvc-iam
      - msvc-field
      - msvc-finance
      - msvc-payment
      - msvc-store
      - msvc-subscription
      - msvc-agriculturalprocess

networks:
  agrocontrol-network:
